<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="sans-serif">
  <rect width="800" height="440" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Recursos REST: la URL nombra, el método actúa</text>

  <!-- Árbol de recursos -->
  <rect x="24" y="56" width="340" height="360" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="194" y="84" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">Recursos (sustantivos en plural)</text>

  <rect x="44" y="104" width="300" height="44" rx="6" fill="#0d1117" stroke="#58a6ff"/>
  <text x="60" y="125" fill="#58a6ff" font-family="monospace" font-size="15">/species</text>
  <text x="60" y="141" fill="#8b949e" font-size="12">colección: GET lista, POST crea</text>

  <rect x="74" y="162" width="270" height="44" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="90" y="183" fill="#3fb950" font-family="monospace" font-size="15">/species/13</text>
  <text x="90" y="199" fill="#8b949e" font-size="12">elemento: GET, PUT, PATCH, DELETE</text>
  <line x1="58" y1="148" x2="58" y2="184" stroke="#30363d" stroke-width="2"/>
  <line x1="58" y1="184" x2="74" y2="184" stroke="#30363d" stroke-width="2"/>

  <rect x="44" y="230" width="300" height="44" rx="6" fill="#0d1117" stroke="#58a6ff"/>
  <text x="60" y="251" fill="#58a6ff" font-family="monospace" font-size="15">/habitats/1/species</text>
  <text x="60" y="267" fill="#8b949e" font-size="12">anidado: las especies del hábitat 1</text>

  <rect x="44" y="290" width="300" height="44" rx="6" fill="#0d1117" stroke="#d29922"/>
  <text x="60" y="311" fill="#d29922" font-family="monospace" font-size="15">/species?habitat=1&amp;page=2</text>
  <text x="60" y="327" fill="#8b949e" font-size="12">filtros y páginas: en la query</text>

  <rect x="44" y="350" width="300" height="50" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="60" y="371" fill="#f85149" font-family="monospace" font-size="12">✗ /getSpecies  ✗ /species/13/delete</text>
  <text x="60" y="389" fill="#8b949e" font-size="12">sin verbos en la ruta: el verbo es el método</text>

  <!-- Tabla de métodos -->
  <rect x="384" y="56" width="392" height="360" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="580" y="84" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">Métodos</text>
  <text x="404" y="114" fill="#8b949e" font-size="13">Método</text>
  <text x="510" y="114" fill="#8b949e" font-size="13">Seguro</text>
  <text x="590" y="114" fill="#8b949e" font-size="13">Idempotente</text>
  <text x="700" y="114" fill="#8b949e" font-size="13">Éxito</text>
  <line x1="398" y1="124" x2="762" y2="124" stroke="#30363d"/>

  <g font-size="14">
    <text x="404" y="152" fill="#58a6ff" font-family="monospace">GET</text>
    <text x="526" y="152" fill="#3fb950">sí</text>
    <text x="620" y="152" fill="#3fb950">sí</text>
    <text x="700" y="152" fill="#c9d1d9" font-family="monospace">200</text>

    <text x="404" y="190" fill="#58a6ff" font-family="monospace">POST</text>
    <text x="526" y="190" fill="#f85149">no</text>
    <text x="620" y="190" fill="#f85149">no</text>
    <text x="700" y="190" fill="#c9d1d9" font-family="monospace">201</text>

    <text x="404" y="228" fill="#58a6ff" font-family="monospace">PUT</text>
    <text x="526" y="228" fill="#f85149">no</text>
    <text x="620" y="228" fill="#3fb950">sí</text>
    <text x="700" y="228" fill="#c9d1d9" font-family="monospace">200</text>

    <text x="404" y="266" fill="#58a6ff" font-family="monospace">PATCH</text>
    <text x="526" y="266" fill="#f85149">no</text>
    <text x="608" y="266" fill="#d29922">depende</text>
    <text x="700" y="266" fill="#c9d1d9" font-family="monospace">200</text>

    <text x="404" y="304" fill="#58a6ff" font-family="monospace">DELETE</text>
    <text x="526" y="304" fill="#f85149">no</text>
    <text x="620" y="304" fill="#3fb950">sí</text>
    <text x="700" y="304" fill="#c9d1d9" font-family="monospace">204</text>
  </g>
  <line x1="398" y1="322" x2="762" y2="322" stroke="#30363d"/>
  <text x="404" y="348" fill="#c9d1d9" font-size="12">Seguro: no cambia nada en el servidor.</text>
  <text x="404" y="370" fill="#c9d1d9" font-size="12">Idempotente: repetirlo deja el servidor igual</text>
  <text x="404" y="388" fill="#c9d1d9" font-size="12">que hacerlo una vez. Se puede reintentar.</text>
</svg>
