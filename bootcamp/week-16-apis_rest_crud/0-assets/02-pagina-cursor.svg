<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
  <rect width="800" height="420" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Paginar por número de página o por cursor</text>

  <!-- Por página -->
  <rect x="24" y="54" width="752" height="160" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="82" fill="#58a6ff" font-size="15" font-weight="bold">Por página</text>
  <text x="160" y="82" fill="#c9d1d9" font-family="monospace" font-size="13">GET /species?page=2&amp;perPage=5</text>

  <g fill="#0d1117" stroke="#30363d">
    <rect x="44" y="100" width="52" height="34" rx="4"/><rect x="102" y="100" width="52" height="34" rx="4"/>
    <rect x="160" y="100" width="52" height="34" rx="4"/><rect x="218" y="100" width="52" height="34" rx="4"/>
    <rect x="276" y="100" width="52" height="34" rx="4"/>
    <rect x="512" y="100" width="52" height="34" rx="4"/><rect x="570" y="100" width="52" height="34" rx="4"/>
  </g>
  <rect x="334" y="96" width="172" height="42" rx="6" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <g fill="#0d1117" stroke="#58a6ff">
    <rect x="338" y="100" width="30" height="34" rx="4"/><rect x="372" y="100" width="30" height="34" rx="4"/>
    <rect x="406" y="100" width="30" height="34" rx="4"/><rect x="440" y="100" width="30" height="34" rx="4"/>
    <rect x="474" y="100" width="28" height="34" rx="4"/>
  </g>
  <text x="186" y="156" text-anchor="middle" fill="#8b949e" font-size="12">página 1 (1.ª a 5.ª)</text>
  <text x="420" y="156" text-anchor="middle" fill="#58a6ff" font-size="12">página 2 (6.ª a 10.ª)</text>
  <text x="567" y="156" text-anchor="middle" fill="#8b949e" font-size="12">página 3</text>
  <text x="44" y="186" fill="#3fb950" font-size="13">✓ Salta a cualquier página y sabe cuántas hay (meta.total, meta.totalPages)</text>
  <text x="44" y="204" fill="#f85149" font-size="13">✗ Si alguien crea o borra mientras tanto, las páginas se corren un puesto</text>

  <!-- Por cursor -->
  <rect x="24" y="232" width="752" height="164" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="260" fill="#3fb950" font-size="15" font-weight="bold">Por cursor</text>
  <text x="160" y="260" fill="#c9d1d9" font-family="monospace" font-size="13">GET /feedings?cursor=f4&amp;limit=3</text>

  <g fill="#0d1117" stroke="#30363d">
    <rect x="44" y="280" width="60" height="34" rx="4"/><rect x="110" y="280" width="60" height="34" rx="4"/>
    <rect x="176" y="280" width="60" height="34" rx="4"/>
  </g>
  <g fill="#0d1117" stroke="#3fb950" stroke-width="2">
    <rect x="300" y="280" width="60" height="34" rx="4"/><rect x="366" y="280" width="60" height="34" rx="4"/>
    <rect x="432" y="280" width="60" height="34" rx="4"/>
  </g>
  <g fill="#0d1117" stroke="#30363d">
    <rect x="556" y="280" width="60" height="34" rx="4"/>
  </g>
  <g fill="#c9d1d9" font-family="monospace" font-size="13" text-anchor="middle">
    <text x="74" y="302">f1</text><text x="140" y="302">f2</text><text x="206" y="302">f3</text>
    <text x="330" y="302">f4</text><text x="396" y="302">f5</text><text x="462" y="302">f6</text>
    <text x="586" y="302">f7</text>
  </g>
  <path d="M 236 297 L 294 297" stroke="#d29922" stroke-width="2"/>
  <polygon points="294,292 300,297 294,302" fill="#d29922"/>
  <path d="M 492 297 L 550 297" stroke="#d29922" stroke-width="2"/>
  <polygon points="550,292 556,297 550,302" fill="#d29922"/>
  <text x="265" y="332" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="12">nextCursor: f4</text>
  <text x="521" y="332" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="12">nextCursor: f7</text>
  <text x="44" y="364" fill="#3fb950" font-size="13">✓ Sigue desde un elemento concreto: los cambios anteriores no descolocan nada</text>
  <text x="44" y="382" fill="#f85149" font-size="13">✗ Solo avanza: no salta a la página 5 ni dice cuántas hay (nextCursor: null = fin)</text>
</svg>
