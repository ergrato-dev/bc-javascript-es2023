<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Los estados de una lista que se carga de una API</text>

  <!-- idle -->
  <rect x="30" y="160" width="120" height="60" rx="30" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="90" y="188" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="16">idle</text>
  <text x="90" y="206" text-anchor="middle" fill="#8b949e" font-size="11">nada pedido aún</text>

  <!-- loading -->
  <rect x="250" y="160" width="140" height="60" rx="30" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="320" y="188" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="16">loading</text>
  <text x="320" y="206" text-anchor="middle" fill="#8b949e" font-size="11">se ve que carga</text>

  <!-- success / empty / error -->
  <rect x="520" y="64" width="150" height="60" rx="30" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="595" y="92" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="16">success</text>
  <text x="595" y="110" text-anchor="middle" fill="#8b949e" font-size="11">la lista y su paginación</text>

  <rect x="520" y="160" width="150" height="60" rx="30" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="595" y="188" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="16">empty</text>
  <text x="595" y="206" text-anchor="middle" fill="#8b949e" font-size="11">«no hay resultados»</text>

  <rect x="520" y="256" width="150" height="60" rx="30" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="595" y="284" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="16">error</text>
  <text x="595" y="302" text-anchor="middle" fill="#8b949e" font-size="11">aviso + datos de antes</text>

  <!-- flechas -->
  <line x1="150" y1="190" x2="242" y2="190" stroke="#c9d1d9" stroke-width="2"/>
  <polygon points="242,185 250,190 242,195" fill="#c9d1d9"/>
  <text x="198" y="180" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">start</text>

  <line x1="390" y1="178" x2="514" y2="104" stroke="#3fb950" stroke-width="2"/>
  <polygon points="510,99 520,100 515,109" fill="#3fb950"/>
  <text x="430" y="128" fill="#3fb950" font-size="12">datos</text>

  <line x1="390" y1="190" x2="512" y2="190" stroke="#d29922" stroke-width="2"/>
  <polygon points="512,185 520,190 512,195" fill="#d29922"/>
  <text x="440" y="182" fill="#d29922" font-size="12">0 datos</text>

  <line x1="390" y1="202" x2="514" y2="276" stroke="#f85149" stroke-width="2"/>
  <polygon points="515,271 520,280 510,281" fill="#f85149"/>
  <text x="420" y="262" fill="#f85149" font-size="12">fallo</text>

  <!-- volver a cargar -->
  <path d="M 670 286 C 760 286 760 360 600 360 L 330 360 C 320 360 320 330 320 228" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="315,232 320,222 325,232" fill="#58a6ff"/>
  <text x="400" y="386" text-anchor="middle" fill="#58a6ff" font-size="12">nueva búsqueda, otra página o reintentar: start otra vez</text>
</svg>
