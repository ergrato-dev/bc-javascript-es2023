<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de la colección</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 id="app-title">🗂️ Panel de la colección</h1>
      <div class="stats-summary">
        <span class="stat">Sesión: <strong id="session-user">sin iniciar</strong></span>
        <span class="stat">Estado: <strong id="state-status">idle</strong></span>
      </div>
    </header>

    <section class="form-section">
      <h2>🔐 Sesión</h2>
      <form id="login-form" class="item-form">
        <div class="form-row">
          <div class="form-group">
            <label for="user">Usuario</label>
            <input type="text" id="user" autocomplete="username" value="editor">
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" autocomplete="current-password">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </div>
      </form>
      <div id="logout-box" class="form-actions" hidden>
        <button type="button" id="logout" class="btn btn-secondary">Cerrar sesión</button>
      </div>

      <h2>🆕 Nueva ficha</h2>
      <form id="create-form" class="item-form" novalidate>
        <div class="form-group">
          <label for="new-name">Nombre</label>
          <input type="text" id="new-name">
          <span class="field-error" id="error-name"></span>
        </div>
        <div class="form-group">
          <label for="new-detail">Detalle</label>
          <input type="text" id="new-detail">
          <span class="field-error" id="error-detail"></span>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Crear</button>
        </div>
      </form>

      <p id="message" class="message" role="status"></p>
    </section>

    <section class="items-section">
      <div class="items-header">
        <h2>📇 Fichas</h2>
      </div>
      <div class="filters">
        <div class="filter-group search-group">
          <label for="search">Buscar por nombre</label>
          <input type="search" id="search" placeholder="Escribe para filtrar">
        </div>
        <div class="filter-group">
          <label for="sort">Orden</label>
          <select id="sort">
            <option value="id">Más antiguas primero</option>
            <option value="-id">Más nuevas primero</option>
            <option value="name">Nombre (A-Z)</option>
            <option value="-name">Nombre (Z-A)</option>
          </select>
        </div>
      </div>
      <p id="status-line" class="message" role="status"></p>
      <div id="item-list" class="item-list"></div>
      <nav class="pagination" aria-label="Paginación">
        <button type="button" id="prev" class="btn btn-outline btn-sm">← Anterior</button>
        <span id="page-label"></span>
        <button type="button" id="next" class="btn btn-outline btn-sm">Siguiente →</button>
      </nav>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
