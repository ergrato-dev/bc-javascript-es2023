<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
  <rect width="800" height="450" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Una instancia compartida o una fábrica</text>

  <!-- Izquierda: módulo con estado -->
  <text x="200" y="72" text-anchor="middle" fill="#d29922" font-size="16" font-weight="bold">Singleton: un módulo con estado</text>
  <rect x="30" y="90" width="150" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="105" y="125" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="14">index.js</text>
  <rect x="220" y="90" width="150" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="295" y="125" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="14">restock.js</text>

  <path d="M 105 150 L 170 220" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="164,225 178,229 174,215" fill="#30363d"/>
  <path d="M 295 150 L 230 220" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="226,215 222,229 236,225" fill="#30363d"/>
  <text x="200" y="190" text-anchor="middle" fill="#8b949e" font-size="12">import</text>

  <rect x="80" y="232" width="240" height="120" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="200" y="262" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="14">inventory.js</text>
  <rect x="120" y="278" width="160" height="44" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="200" y="305" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="13">units: Map</text>
  <text x="200" y="342" text-anchor="middle" fill="#8b949e" font-size="12">se ejecuta una sola vez</text>

  <text x="200" y="390" text-anchor="middle" fill="#c9d1d9" font-size="13">Los dos ven el mismo Map:</text>
  <text x="200" y="410" text-anchor="middle" fill="#c9d1d9" font-size="13">lo que cambia uno, lo ve el otro.</text>

  <!-- Separador -->
  <path d="M 400 70 L 400 420" stroke="#30363d" stroke-width="1" stroke-dasharray="6 6" fill="none"/>

  <!-- Derecha: fábrica -->
  <text x="600" y="72" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold">Factory: uno nuevo en cada llamada</text>
  <rect x="490" y="90" width="220" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="14">createInventory()</text>

  <path d="M 545 150 L 510 220" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="503,216 505,230 516,222" fill="#30363d"/>
  <path d="M 655 150 L 690 220" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="684,222 695,230 697,216" fill="#30363d"/>

  <rect x="430" y="232" width="160" height="120" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="510" y="262" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="14">north</text>
  <rect x="450" y="278" width="120" height="44" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="510" y="305" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="13">units: Map</text>

  <rect x="610" y="232" width="160" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="690" y="262" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="14">south</text>
  <rect x="630" y="278" width="120" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="690" y="305" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="13">units: Map</text>

  <text x="600" y="390" text-anchor="middle" fill="#c9d1d9" font-size="13">Cada uno tiene su Map, privado</text>
  <text x="600" y="410" text-anchor="middle" fill="#c9d1d9" font-size="13">en un closure: no se mezclan.</text>
</svg>
