<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
  <rect width="800" height="450" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">El patrón Observer</text>

  <!-- Emisor del evento -->
  <rect x="30" y="160" width="190" height="110" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="125" y="192" text-anchor="middle" fill="#d29922" font-size="16" font-weight="bold">El almacén</text>
  <text x="125" y="220" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">emit('low', datos)</text>
  <text x="125" y="248" text-anchor="middle" fill="#8b949e" font-size="12">no sabe quién escucha</text>

  <path d="M 220 215 L 290 215" stroke="#30363d" stroke-width="3" fill="none"/>
  <polygon points="290,208 304,215 290,222" fill="#30363d"/>

  <!-- Emisor -->
  <rect x="306" y="110" width="200" height="210" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="406" y="142" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">El emisor</text>
  <text x="406" y="168" text-anchor="middle" fill="#8b949e" font-size="12">oyentes de 'low', en orden</text>
  <rect x="326" y="184" width="160" height="34" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="406" y="206" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">1. aviso</text>
  <rect x="326" y="226" width="160" height="34" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="406" y="248" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">2. compras</text>
  <rect x="326" y="268" width="160" height="34" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="406" y="290" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="13">3. (quitado)</text>

  <!-- Flechas a oyentes -->
  <path d="M 486 201 L 580 130" stroke="#3fb950" stroke-width="3" fill="none"/>
  <polygon points="575,124 590,123 583,136" fill="#3fb950"/>
  <path d="M 486 243 L 580 243" stroke="#3fb950" stroke-width="3" fill="none"/>
  <polygon points="580,236 594,243 580,250" fill="#3fb950"/>

  <!-- Oyentes -->
  <rect x="596" y="90" width="180" height="70" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="686" y="120" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="bold">aviso</text>
  <text x="686" y="142" text-anchor="middle" fill="#c9d1d9" font-size="12">muestra «quedan 2»</text>
  <rect x="596" y="208" width="180" height="70" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="686" y="238" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="bold">compras</text>
  <text x="686" y="260" text-anchor="middle" fill="#c9d1d9" font-size="12">pide más unidades</text>
  <rect x="596" y="318" width="180" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="686" y="348" text-anchor="middle" fill="#8b949e" font-size="15" font-weight="bold">registro</text>
  <text x="686" y="370" text-anchor="middle" fill="#8b949e" font-size="12">llamó a off(): no recibe nada</text>

  <!-- Pie -->
  <text x="406" y="360" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">const off = on('low', fn)</text>
  <text x="406" y="384" text-anchor="middle" fill="#8b949e" font-size="12">on añade a la lista; off() quita de ella</text>
  <text x="400" y="430" text-anchor="middle" fill="#c9d1d9" font-size="13">Un interesado nuevo se suscribe desde fuera: el almacén no cambia.</text>
</svg>
