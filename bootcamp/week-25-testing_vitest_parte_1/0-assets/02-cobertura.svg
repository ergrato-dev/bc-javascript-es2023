<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
  <rect width="800" height="420" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Lo que la cobertura ve</text>

  <!-- Tests -->
  <rect x="30" y="56" width="740" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="83" fill="#c9d1d9" font-size="13">Los tests solo llaman a <tspan font-family="monospace" fill="#58a6ff">toGrade(9.5)</tspan> y <tspan font-family="monospace" fill="#58a6ff">toGrade(8)</tspan></text>

  <!-- Código -->
  <rect x="30" y="152" width="470" height="164" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="31" y="183" width="468" height="26" fill="#3fb950" opacity="0.15"/>
  <rect x="31" y="209" width="468" height="26" fill="#3fb950" opacity="0.15"/>
  <rect x="31" y="235" width="468" height="26" fill="#f85149" opacity="0.2"/>
  <rect x="31" y="261" width="468" height="26" fill="#f85149" opacity="0.2"/>
  <g font-family="monospace" font-size="13">
    <text x="46" y="174" fill="#8b949e">1</text>
    <text x="46" y="200" fill="#8b949e">2</text>
    <text x="46" y="226" fill="#8b949e">3</text>
    <text x="46" y="252" fill="#8b949e">4</text>
    <text x="46" y="278" fill="#8b949e">5</text>
    <text x="46" y="304" fill="#8b949e">6</text>
    <g fill="#c9d1d9">
      <text x="76" y="174">const toGrade = (score) =&gt; {</text>
      <text x="92" y="200">if (score &gt;= 9) return 'Sobresaliente';</text>
      <text x="92" y="226">if (score &gt;= 7) return 'Notable';</text>
      <text x="92" y="252">if (score &gt;= 5) return 'Aprobado';</text>
      <text x="92" y="278">return 'Suspenso';</text>
      <text x="76" y="304">};</text>
    </g>
  </g>
  <rect x="456" y="214" width="34" height="16" rx="3" fill="#d29922"/>
  <text x="473" y="226" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">else</text>

  <!-- Explicación -->
  <g font-size="13" fill="#c9d1d9">
    <rect x="520" y="116" width="4" height="52" fill="#3fb950"/>
    <text x="534" y="136" fill="#3fb950" font-weight="bold">Líneas 2 y 3: se ejecutan</text>
    <text x="534" y="158">9.5 sale en la 2; 8, en la 3</text>

    <rect x="520" y="184" width="4" height="52" fill="#d29922"/>
    <text x="534" y="204" fill="#d29922" font-weight="bold">Una rama sin tomar</text>
    <text x="534" y="226">El «no» del if de la línea 3</text>

    <rect x="520" y="252" width="4" height="64" fill="#f85149"/>
    <text x="534" y="272" fill="#f85149" font-weight="bold">Líneas 4 y 5: nunca</text>
    <text x="534" y="294">Si tienen un error, ningún</text>
    <text x="534" y="312">test lo encontrará</text>
  </g>

  <!-- Resumen -->
  <rect x="30" y="332" width="740" height="68" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="358" fill="#c9d1d9" font-size="13">Ramas: 3 de 6 (las dos del primer if y el «sí» del segundo).</text>
  <text x="46" y="384" fill="#8b949e" font-size="13">La cobertura cuenta lo que se ejecutó, no si un expect lo comprobó.</text>
</svg>
