<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif">
  <rect width="800" height="360" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Una URL para un Blob</text>

  <!-- Blob en memoria -->
  <rect x="30" y="80" width="170" height="110" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="110" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">Blob o File</text>
  <text x="115" y="134" text-anchor="middle" fill="#c9d1d9" font-size="12">en la memoria</text>
  <text x="115" y="152" text-anchor="middle" fill="#c9d1d9" font-size="12">de esta pestaña</text>
  <text x="115" y="176" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">image/svg+xml</text>

  <!-- createObjectURL -->
  <line x1="200" y1="135" x2="290" y2="135" stroke="#3fb950" stroke-width="2"/>
  <polygon points="290,129 300,135 290,141" fill="#3fb950"/>
  <text x="250" y="124" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="10">createObjectURL</text>

  <rect x="300" y="100" width="200" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="400" y="128" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">blob:null/fdee0a46-…</text>
  <text x="400" y="152" text-anchor="middle" fill="#8b949e" font-size="11">Unos 50 caracteres</text>

  <!-- usos -->
  <line x1="500" y1="120" x2="560" y2="90" stroke="#8b949e" stroke-width="2"/>
  <line x1="500" y1="150" x2="560" y2="180" stroke="#8b949e" stroke-width="2"/>
  <rect x="560" y="60" width="210" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="665" y="86" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">&lt;img src="blob:…"&gt;</text>
  <text x="665" y="106" text-anchor="middle" fill="#8b949e" font-size="11">Vista previa sin subir nada</text>
  <rect x="560" y="150" width="210" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="665" y="176" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">&lt;a download="x.csv"&gt;</text>
  <text x="665" y="196" text-anchor="middle" fill="#8b949e" font-size="11">Descarga con click()</text>

  <!-- revoke -->
  <line x1="400" y1="170" x2="400" y2="240" stroke="#f85149" stroke-width="2"/>
  <polygon points="394,240 400,250 406,240" fill="#f85149"/>
  <rect x="270" y="250" width="260" height="70" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="400" y="276" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="12">URL.revokeObjectURL(url)</text>
  <text x="400" y="298" text-anchor="middle" fill="#8b949e" font-size="11">Libera la memoria: cargas nuevas fallan</text>

  <text x="40" y="250" fill="#d29922" font-size="12">Cuándo revocar</text>
  <text x="40" y="272" fill="#8b949e" font-size="12">Imagen: en su evento load</text>
  <text x="40" y="292" fill="#8b949e" font-size="12">Descarga: tras click()</text>
  <text x="40" y="312" fill="#8b949e" font-size="12">Al cerrar la pestaña: sola</text>

  <text x="565" y="250" fill="#d29922" font-size="12">data:image/svg+xml;base64,…</text>
  <text x="565" y="272" fill="#8b949e" font-size="12">Lleva el contenido dentro:</text>
  <text x="565" y="292" fill="#8b949e" font-size="12">un tercio más grande,</text>
  <text x="565" y="312" fill="#8b949e" font-size="12">pero se puede guardar</text>
</svg>
