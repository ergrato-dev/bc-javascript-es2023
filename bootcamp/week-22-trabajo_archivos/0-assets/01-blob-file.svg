<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Blob y File</text>

  <!-- File envuelve Blob -->
  <rect x="30" y="60" width="430" height="310" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="50" y="88" fill="#3fb950" font-size="16" font-weight="bold">File</text>
  <text x="50" y="112" fill="#c9d1d9" font-family="monospace" font-size="13">name: 'sesiones.csv'</text>
  <text x="50" y="134" fill="#c9d1d9" font-family="monospace" font-size="13">lastModified: 1793610000000</text>

  <rect x="50" y="152" width="390" height="198" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="70" y="180" fill="#58a6ff" font-size="16" font-weight="bold">Blob</text>
  <text x="70" y="204" fill="#c9d1d9" font-family="monospace" font-size="13">type: 'text/csv'</text>
  <text x="70" y="226" fill="#c9d1d9" font-family="monospace" font-size="13">size: 20  (bytes, no caracteres)</text>

  <!-- bytes -->
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="70" y="248" width="44" height="34" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="92" y="270" fill="#c9d1d9">69</text>
    <rect x="118" y="248" width="44" height="34" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="140" y="270" fill="#c9d1d9">64</text>
    <rect x="166" y="248" width="44" height="34" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="188" y="270" fill="#c9d1d9">2c</text>
    <rect x="214" y="248" width="44" height="34" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="236" y="270" fill="#c9d1d9">74</text>
    <rect x="262" y="248" width="44" height="34" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="284" y="270" fill="#c9d1d9">69</text>
    <text x="340" y="270" fill="#8b949e">…</text>
  </g>
  <text x="70" y="306" fill="#8b949e" font-size="12">Los bytes de «id,ti…» en UTF-8</text>
  <text x="70" y="330" fill="#d29922" font-size="12">No se puede cambiar: para otro contenido, otro Blob</text>

  <!-- Leer -->
  <rect x="500" y="60" width="270" height="310" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="635" y="88" text-anchor="middle" fill="#F7DF1E" font-size="16" font-weight="bold">Leer (promesas)</text>

  <text x="520" y="124" fill="#58a6ff" font-family="monospace" font-size="14">await blob.text()</text>
  <text x="520" y="144" fill="#8b949e" font-size="12">Texto UTF-8 (quita la marca BOM)</text>

  <text x="520" y="180" fill="#58a6ff" font-family="monospace" font-size="14">await blob.bytes()</text>
  <text x="520" y="200" fill="#8b949e" font-size="12">Uint8Array con cada byte</text>

  <text x="520" y="236" fill="#58a6ff" font-family="monospace" font-size="14">await blob.arrayBuffer()</text>
  <text x="520" y="256" fill="#8b949e" font-size="12">Memoria cruda (TextDecoder)</text>

  <text x="520" y="292" fill="#3fb950" font-family="monospace" font-size="14">blob.slice(0, 4)</text>
  <text x="520" y="312" fill="#8b949e" font-size="12">Otro Blob con un trozo, sin leer:</text>
  <text x="520" y="330" fill="#8b949e" font-size="12">sirve para mirar la firma</text>

  <line x1="460" y1="215" x2="496" y2="215" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="496,209 506,215 496,221" fill="#58a6ff"/>
</svg>
