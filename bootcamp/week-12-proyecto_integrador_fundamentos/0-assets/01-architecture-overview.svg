<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="#0d1117"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#c9d1d9">Tres archivos, tres responsabilidades</text>

  <!-- index.html -->
  <rect x="300" y="65" width="200" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="92" text-anchor="middle" font-family="monospace" font-size="14" fill="#c9d1d9">index.html</text>
  <line x1="400" y1="109" x2="400" y2="143" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="131" font-size="11" fill="#8b949e">carga</text>

  <!-- main.js -->
  <rect x="250" y="145" width="300" height="90" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="400" y="172" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#d29922">src/main.js</text>
  <text x="400" y="195" text-anchor="middle" font-size="12" fill="#c9d1d9">La página: lee el DOM, escucha eventos</text>
  <text x="400" y="214" text-anchor="middle" font-size="12" fill="#c9d1d9">y pinta con render()</text>

  <!-- data.js -->
  <rect x="30" y="290" width="230" height="130" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="145" y="317" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#3fb950">src/data.js</text>
  <text x="145" y="342" text-anchor="middle" font-size="12" fill="#c9d1d9">Los datos de tu dominio</text>
  <text x="145" y="366" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">TITLE, ID_PREFIX, ROOMS</text>
  <text x="145" y="386" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">export default [piezas]</text>

  <!-- logic.js -->
  <rect x="300" y="290" width="300" height="130" rx="8" fill="#161b22" stroke="#F7DF1E" stroke-width="2"/>
  <text x="450" y="317" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#F7DF1E">src/logic.js</text>
  <text x="450" y="340" text-anchor="middle" font-size="12" fill="#c9d1d9">La lógica, sin DOM (lo que escribes tú)</text>
  <text x="450" y="364" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">ValidationError, validatePiece</text>
  <text x="450" y="383" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">class Collection</text>
  <text x="450" y="402" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">search, paginate, summarize</text>

  <!-- checks -->
  <rect x="640" y="315" width="140" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="710" y="345" text-anchor="middle" font-size="12" fill="#c9d1d9">checks.json</text>
  <text x="710" y="366" text-anchor="middle" font-size="11" fill="#8b949e">la prueba desde</text>
  <text x="710" y="382" text-anchor="middle" font-size="11" fill="#8b949e">Node, sin navegador</text>

  <!-- imports -->
  <line x1="320" y1="235" x2="180" y2="286" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="252" font-family="monospace" font-size="11" fill="#58a6ff">import</text>
  <line x1="440" y1="235" x2="445" y2="286" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="264" font-family="monospace" font-size="11" fill="#58a6ff">import</text>
  <line x1="640" y1="355" x2="604" y2="355" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
