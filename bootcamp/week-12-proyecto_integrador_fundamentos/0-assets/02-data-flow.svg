<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#0d1117"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#c9d1d9">Qué pasa al pulsar «Añadir»</text>

  <!-- 1 -->
  <rect x="30" y="70" width="200" height="70" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="130" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#d29922">1 · main.js</text>
  <text x="130" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#c9d1d9">collection.add(datos)</text>

  <!-- 2 -->
  <rect x="300" y="70" width="200" height="70" rx="8" fill="#161b22" stroke="#F7DF1E"/>
  <text x="400" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#F7DF1E">2 · validatePiece</text>
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="#c9d1d9">copia limpia o error</text>

  <!-- error -->
  <rect x="570" y="70" width="200" height="70" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="670" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#f85149">ValidationError</text>
  <text x="670" y="120" text-anchor="middle" font-size="11" fill="#c9d1d9">el catch de main.js</text>
  <text x="670" y="160" text-anchor="middle" font-size="11" fill="#8b949e">«Revisa el campo name...»</text>
  <text x="670" y="176" text-anchor="middle" font-size="11" fill="#8b949e">y nada cambia</text>

  <!-- 3 -->
  <rect x="300" y="200" width="200" height="70" rx="8" fill="#161b22" stroke="#F7DF1E"/>
  <text x="400" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#F7DF1E">3 · guardar</text>
  <text x="400" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="#c9d1d9">#pieces.set(id, pieza)</text>

  <!-- 4 -->
  <rect x="300" y="330" width="200" height="70" rx="8" fill="#161b22" stroke="#F7DF1E"/>
  <text x="400" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#F7DF1E">4 · #notify()</text>
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#c9d1d9">llama a cada suscriptor</text>

  <!-- 5 -->
  <rect x="30" y="330" width="200" height="70" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="130" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#d29922">5 · render()</text>
  <text x="130" y="380" text-anchor="middle" font-family="monospace" font-size="11" fill="#c9d1d9">summarize, search, paginate</text>

  <!-- 6 -->
  <rect x="30" y="200" width="200" height="70" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="130" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#3fb950">6 · la página</text>
  <text x="130" y="250" text-anchor="middle" font-size="11" fill="#c9d1d9">cabecera, lista y páginas</text>

  <!-- arrows -->
  <line x1="230" y1="105" x2="296" y2="105" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="105" x2="566" y2="105" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="533" y="96" text-anchor="middle" font-size="10" fill="#f85149">no vale</text>
  <line x1="400" y1="140" x2="400" y2="196" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="173" font-size="10" fill="#8b949e">vale</text>
  <line x1="400" y1="270" x2="400" y2="326" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="365" x2="234" y2="365" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="330" x2="130" y2="274" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="400" y="440" text-anchor="middle" font-size="12" fill="#8b949e">Borrar sigue el mismo camino desde el paso 3: remove() → #notify() → render()</text>
</svg>
