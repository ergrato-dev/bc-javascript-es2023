<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichas con notas reservadas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 id="app-title">🗂️ Fichas con notas reservadas</h1>
      <div class="stats-summary">
        <span class="stat">Piezas: <strong id="stat-pieces">0</strong></span>
        <span class="stat">Valor total: <strong id="stat-value">0</strong></span>
      </div>
    </header>

    <section class="form-section">
      <h2>➕ Nueva pieza</h2>
      <form id="item-form" class="item-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="item-name">Nombre</label>
            <input type="text" id="item-name">
            <small class="field-error" id="error-name"></small>
          </div>
          <div class="form-group">
            <label for="item-room">Sala</label>
            <input type="text" id="item-room">
            <small class="field-error" id="error-room"></small>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="item-value">Valor (€)</label>
            <input type="number" id="item-value" min="0" step="1">
            <small class="field-error" id="error-value"></small>
          </div>
          <div class="form-group">
            <label for="item-note">Nota reservada</label>
            <input type="text" id="item-note">
            <small class="field-error" id="error-note"></small>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Añadir</button>
        </div>
      </form>
    </section>

    <section class="filters-section">
      <div class="filters">
        <div class="filter-group">
          <label for="show-notes">
            <input type="checkbox" id="show-notes">
            Ver notas reservadas
          </label>
        </div>
      </div>
    </section>

    <section class="items-section">
      <div class="items-header">
        <h2>📝 Piezas</h2>
      </div>
      <div id="item-list" class="item-list"></div>
      <div id="empty-state" class="empty-state">
        <p>📭 No hay piezas que mostrar</p>
        <p class="empty-state-hint">Añade una pieza con el formulario</p>
      </div>

      <div class="public-view">
        <h2>📤 Vista pública</h2>
        <p id="hidden-info"></p>
        <pre id="public-json"></pre>
      </div>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
