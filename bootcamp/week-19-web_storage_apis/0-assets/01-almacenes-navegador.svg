<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
  <rect width="800" height="420" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Tres sitios para guardar datos en el navegador</text>

  <!-- Cabeceras -->
  <rect x="190" y="56" width="190" height="44" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="285" y="84" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="15" font-weight="bold">localStorage</text>
  <rect x="396" y="56" width="190" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="491" y="84" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="15" font-weight="bold">sessionStorage</text>
  <rect x="602" y="56" width="182" height="44" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="693" y="84" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="15" font-weight="bold">IndexedDB</text>

  <!-- Filas -->
  <g font-size="13" fill="#c9d1d9">
    <rect x="16" y="112" width="768" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="30" y="143" fill="#8b949e" font-weight="bold">Cuánto dura</text>
    <text x="285" y="134" text-anchor="middle">Hasta que se borra</text>
    <text x="285" y="152" text-anchor="middle" fill="#8b949e" font-size="12">(sobrevive al cierre)</text>
    <text x="491" y="134" text-anchor="middle">Lo que dura la pestaña</text>
    <text x="491" y="152" text-anchor="middle" fill="#8b949e" font-size="12">(sobrevive a recargar)</text>
    <text x="693" y="134" text-anchor="middle">Hasta que se borra</text>
    <text x="693" y="152" text-anchor="middle" fill="#8b949e" font-size="12">(sobrevive al cierre)</text>

    <rect x="16" y="172" width="768" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="30" y="203" fill="#8b949e" font-weight="bold">Quién lo ve</text>
    <text x="285" y="194" text-anchor="middle">Todas las pestañas</text>
    <text x="285" y="212" text-anchor="middle" fill="#8b949e" font-size="12">del mismo origen</text>
    <text x="491" y="194" text-anchor="middle">Solo esa pestaña</text>
    <text x="491" y="212" text-anchor="middle" fill="#8b949e" font-size="12">(y su origen)</text>
    <text x="693" y="194" text-anchor="middle">Todas las pestañas</text>
    <text x="693" y="212" text-anchor="middle" fill="#8b949e" font-size="12">del mismo origen</text>

    <rect x="16" y="232" width="768" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="30" y="263" fill="#8b949e" font-weight="bold">Qué guarda</text>
    <text x="388" y="254" text-anchor="middle">Solo texto: clave y valor son strings</text>
    <text x="388" y="272" text-anchor="middle" fill="#8b949e" font-size="12">objetos, con JSON.stringify y JSON.parse</text>
    <text x="693" y="254" text-anchor="middle">Objetos, Date, Map,</text>
    <text x="693" y="272" text-anchor="middle">Blob... con índices</text>

    <rect x="16" y="292" width="768" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="30" y="323" fill="#8b949e" font-weight="bold">Cómo se usa</text>
    <text x="388" y="314" text-anchor="middle">Síncrono: getItem devuelve el valor al momento</text>
    <text x="388" y="332" text-anchor="middle" fill="#8b949e" font-size="12">unos 5 Mi caracteres por origen en Chromium</text>
    <text x="693" y="314" text-anchor="middle">Asíncrono: eventos</text>
    <text x="693" y="332" text-anchor="middle" fill="#8b949e" font-size="12">y mucho más espacio</text>

    <rect x="16" y="352" width="768" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="30" y="383" fill="#8b949e" font-weight="bold">Para qué</text>
    <text x="285" y="374" text-anchor="middle">Preferencias, listas</text>
    <text x="285" y="392" text-anchor="middle">pequeñas, caché corta</text>
    <text x="491" y="374" text-anchor="middle">Borradores, pasos de</text>
    <text x="491" y="392" text-anchor="middle">un formulario, filtros</text>
    <text x="693" y="374" text-anchor="middle">Muchos registros,</text>
    <text x="693" y="392" text-anchor="middle">búsquedas, sin conexión</text>
  </g>
</svg>
