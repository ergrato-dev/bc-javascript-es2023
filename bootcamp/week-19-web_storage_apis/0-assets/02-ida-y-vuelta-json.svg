<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Guardar un objeto: ida y vuelta por texto</text>

  <!-- Objeto -->
  <rect x="16" y="70" width="200" height="120" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="116" y="96" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Objeto en memoria</text>
  <text x="32" y="124" fill="#c9d1d9" font-family="monospace" font-size="12">{ id: 7,</text>
  <text x="32" y="144" fill="#c9d1d9" font-family="monospace" font-size="12">  expires: Date,</text>
  <text x="32" y="164" fill="#c9d1d9" font-family="monospace" font-size="12">  tanks: [...] }</text>

  <!-- Texto -->
  <rect x="300" y="70" width="200" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="400" y="96" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">Texto JSON</text>
  <text x="400" y="128" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11">{"id":7,"expires":</text>
  <text x="400" y="146" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11">"2026-12-31T10:00..."</text>
  <text x="400" y="164" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11">,"tanks":[...]}</text>

  <!-- Almacén -->
  <rect x="584" y="70" width="200" height="120" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="684" y="100" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="14" font-weight="bold">localStorage</text>
  <text x="684" y="128" text-anchor="middle" fill="#c9d1d9" font-size="12">clave → texto</text>
  <text x="684" y="150" text-anchor="middle" fill="#8b949e" font-size="12">sobrevive a recargar</text>
  <text x="684" y="168" text-anchor="middle" fill="#8b949e" font-size="12">y a cerrar el navegador</text>

  <!-- Ida -->
  <line x1="216" y1="106" x2="296" y2="106" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="256" y="94" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="11">stringify</text>
  <line x1="500" y1="106" x2="580" y2="106" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="94" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="11">setItem</text>

  <!-- Vuelta -->
  <line x1="580" y1="160" x2="504" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="182" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="11">getItem</text>
  <line x1="296" y1="160" x2="220" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="256" y="182" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="11">parse</text>

  <!-- Lo que se pierde -->
  <rect x="16" y="220" width="370" height="160" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="201" y="246" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">Lo que no vuelve igual</text>
  <text x="32" y="274" fill="#c9d1d9" font-size="13">Date → texto ISO (reviver para recuperarlo)</text>
  <text x="32" y="298" fill="#c9d1d9" font-size="13">Map y Set → {} (guárdalos como arrays)</text>
  <text x="32" y="322" fill="#c9d1d9" font-size="13">undefined y funciones → desaparecen</text>
  <text x="32" y="346" fill="#c9d1d9" font-size="13">NaN e Infinity → null · BigInt → TypeError</text>
  <text x="32" y="368" fill="#8b949e" font-size="12">Y el objeto leído es otro: === da false</text>

  <!-- Al leer -->
  <rect x="414" y="220" width="370" height="160" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="599" y="246" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">Al leer, desconfía</text>
  <text x="430" y="274" fill="#c9d1d9" font-size="13">getItem da null si la clave no existe</text>
  <text x="430" y="298" fill="#c9d1d9" font-size="13">parse lanza SyntaxError si el texto está roto</text>
  <text x="430" y="322" fill="#c9d1d9" font-size="13">La forma puede ser de otra versión</text>
  <text x="430" y="346" fill="#c9d1d9" font-family="monospace" font-size="12">{ version, entries } → migrate</text>
  <text x="430" y="368" fill="#8b949e" font-size="12">try/catch, validar y valor por defecto</text>
</svg>
