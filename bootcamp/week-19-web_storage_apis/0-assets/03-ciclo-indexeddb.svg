<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">IndexedDB: abrir, cambiar la estructura y usar transacciones</text>

  <!-- open -->
  <rect x="16" y="70" width="190" height="80" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="111" y="98" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Abrir</text>
  <text x="111" y="124" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">indexedDB.open(</text>
  <text x="111" y="140" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">'nombre', versión)</text>

  <!-- upgradeneeded -->
  <rect x="260" y="52" width="250" height="118" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="385" y="80" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">upgradeneeded</text>
  <text x="385" y="102" text-anchor="middle" fill="#c9d1d9" font-size="12">Solo si la versión sube (0 → 1, 1 → 2)</text>
  <text x="385" y="124" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">createObjectStore(...)</text>
  <text x="385" y="142" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">createIndex(...)</text>
  <text x="385" y="158" text-anchor="middle" fill="#8b949e" font-size="11">el único sitio donde cambia la estructura</text>

  <!-- success -->
  <rect x="564" y="70" width="220" height="80" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="674" y="98" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">success</text>
  <text x="674" y="124" text-anchor="middle" fill="#c9d1d9" font-size="12">request.result es la base</text>
  <text x="674" y="140" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="12">db</text>

  <line x1="206" y1="110" x2="256" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="110" x2="560" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- transaction -->
  <line x1="674" y1="150" x2="674" y2="196" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="16" y="200" width="768" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="32" y="226" fill="#c9d1d9" font-size="14" font-weight="bold">Transacción</text>
  <text x="32" y="248" fill="#c9d1d9" font-family="monospace" font-size="12">db.transaction('animals', 'readwrite').objectStore('animals')</text>
  <rect x="32" y="258" width="150" height="28" rx="6" fill="#0d1117" stroke="#58a6ff"/>
  <text x="107" y="277" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12">add · put</text>
  <rect x="196" y="258" width="150" height="28" rx="6" fill="#0d1117" stroke="#58a6ff"/>
  <text x="271" y="277" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12">get · getAll</text>
  <rect x="360" y="258" width="150" height="28" rx="6" fill="#0d1117" stroke="#58a6ff"/>
  <text x="435" y="277" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12">delete · count</text>
  <rect x="524" y="258" width="244" height="28" rx="6" fill="#0d1117" stroke="#58a6ff"/>
  <text x="646" y="277" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12">index('byTank').getAll(...)</text>

  <!-- final -->
  <line x1="200" y1="296" x2="200" y2="316" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="296" x2="600" y2="316" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="16" y="320" width="370" height="64" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="201" y="346" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">complete</text>
  <text x="201" y="368" text-anchor="middle" fill="#c9d1d9" font-size="12">todas las peticiones se guardan juntas</text>
  <rect x="414" y="320" width="370" height="64" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="599" y="346" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">abort</text>
  <text x="599" y="368" text-anchor="middle" fill="#c9d1d9" font-size="12">una petición falla: no se guarda ninguna</text>
</svg>
