<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliente del catálogo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 id="app-title">🗂️ Cliente del catálogo</h1>
      <div class="stats-summary">
        <span class="stat">En pantalla: <strong id="stat-items">0</strong></span>
        <span class="stat">Peticiones: <strong id="stat-requests">0</strong></span>
      </div>
    </header>

    <section class="form-section">
      <h2>🔎 Buscar</h2>
      <form id="search-form" class="item-form">
        <div class="form-row">
          <div class="form-group">
            <label for="search">Nombre contiene</label>
            <input type="text" id="search" placeholder="Vacío para verlas todas">
          </div>
          <div class="form-group">
            <label for="limit">Cuántas como máximo</label>
            <input type="number" id="limit" min="1" max="20" placeholder="Todas">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
      </form>

      <h2>🆕 Nueva ficha</h2>
      <form id="create-form" class="item-form">
        <div class="form-group">
          <label for="new-name">Nombre</label>
          <input type="text" id="new-name">
        </div>
        <div class="form-group">
          <label for="new-detail">Detalle</label>
          <input type="text" id="new-detail">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Crear</button>
        </div>
      </form>

      <h2>📄 Abrir una ficha</h2>
      <form id="open-form" class="item-form">
        <div class="form-group">
          <label for="open-id">Id</label>
          <input type="number" id="open-id" min="1" value="1">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-secondary">Abrir</button>
        </div>
      </form>

      <p id="message" class="message" role="status"></p>
      <div class="change-log">
        <h2>📜 Peticiones</h2>
        <ol id="request-log"></ol>
      </div>
    </section>

    <section class="items-section">
      <div class="items-header">
        <h2>📇 Fichas</h2>
      </div>
      <div id="item-list" class="item-list"></div>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
