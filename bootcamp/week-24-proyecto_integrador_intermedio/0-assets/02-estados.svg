<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Los estados de la lista</text>

  <!-- Nota sobre savedAt -->
  <rect x="30" y="60" width="330" height="84" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="46" y="84" fill="#c9d1d9" font-size="13" font-weight="bold"><tspan font-family="monospace">savedAt</tspan> ≠ null: fichas de la copia local</text>
  <text x="46" y="106" fill="#8b949e" font-size="12"><tspan font-family="monospace">cached</tspan> la pone sin cambiar el status</text>
  <text x="46" y="126" fill="#8b949e" font-size="12"><tspan font-family="monospace">loaded</tspan> la borra; <tspan font-family="monospace">load</tspan> y <tspan font-family="monospace">failed</tspan> la conservan</text>

  <!-- Estados -->
  <rect x="40" y="200" width="120" height="56" rx="28" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="100" y="233" text-anchor="middle" fill="#c9d1d9" font-size="15" font-family="monospace">idle</text>

  <rect x="250" y="200" width="150" height="56" rx="28" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="325" y="226" text-anchor="middle" fill="#58a6ff" font-size="15" font-family="monospace">loading</text>
  <text x="325" y="244" text-anchor="middle" fill="#8b949e" font-size="11">«Cargando…»</text>

  <rect x="560" y="80" width="200" height="56" rx="28" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="660" y="106" text-anchor="middle" fill="#3fb950" font-size="15" font-family="monospace">ready</text>
  <text x="660" y="124" text-anchor="middle" fill="#8b949e" font-size="11">«12 fichas · página 1 de 2»</text>

  <rect x="560" y="200" width="200" height="56" rx="28" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="660" y="226" text-anchor="middle" fill="#d29922" font-size="15" font-family="monospace">empty</text>
  <text x="660" y="244" text-anchor="middle" fill="#8b949e" font-size="11">«Ninguna ficha coincide…»</text>

  <rect x="560" y="320" width="200" height="56" rx="28" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="660" y="346" text-anchor="middle" fill="#f85149" font-size="15" font-family="monospace">error</text>
  <text x="660" y="364" text-anchor="middle" fill="#8b949e" font-size="11">el motivo y «Reintentar»</text>

  <!-- Transiciones -->
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="160" y1="228" x2="248" y2="228"/>
    <path d="M400 214 C 470 180, 500 110, 558 108"/>
    <line x1="400" y1="228" x2="558" y2="228"/>
    <path d="M400 242 C 470 276, 500 346, 558 348"/>
    <path d="M560 372 C 450 410, 330 400, 325 258"/>
  </g>
  <g font-size="12" font-family="monospace" fill="#c9d1d9">
    <text x="204" y="220" text-anchor="middle">load</text>
    <text x="440" y="148">loaded</text>
    <text x="452" y="220">loaded []</text>
    <text x="440" y="322">failed</text>
  </g>
  <text x="430" y="404" text-anchor="middle" fill="#8b949e" font-size="11">load desde cualquier estado: buscar, cambiar de página, reintentar</text>
  <text x="660" y="164" text-anchor="middle" fill="#8b949e" font-size="11"><tspan font-family="monospace">saved</tspan> y <tspan font-family="monospace">removed</tspan>: ready, o empty si no quedan</text>
</svg>
