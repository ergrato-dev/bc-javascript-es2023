<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Cuatro archivos y un camino en una sola dirección</text>

  <!-- Persona -->
  <rect x="20" y="80" width="120" height="130" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="108" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">Persona</text>
  <text x="80" y="134" text-anchor="middle" fill="#8b949e" font-size="11">escribe, pulsa,</text>
  <text x="80" y="150" text-anchor="middle" fill="#8b949e" font-size="11">envía</text>
  <text x="80" y="180" text-anchor="middle" fill="#8b949e" font-size="11">ve la pantalla</text>

  <!-- main.js -->
  <rect x="180" y="70" width="180" height="220" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="270" y="98" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold" font-family="monospace">main.js</text>
  <text x="270" y="117" text-anchor="middle" fill="#8b949e" font-size="11">la página: usa el DOM</text>
  <g fill="#c9d1d9" font-size="12" font-family="monospace">
    <text x="196" y="150">listeners</text>
    <text x="196" y="174">dispatch(evento)</text>
    <text x="196" y="198">render()</text>
    <text x="196" y="222">messageFor(error)</text>
    <text x="196" y="246">showErrors(errors)</text>
  </g>

  <!-- logic.js -->
  <rect x="400" y="70" width="190" height="220" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="495" y="98" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold" font-family="monospace">logic.js</text>
  <text x="495" y="117" text-anchor="middle" fill="#8b949e" font-size="11">sin DOM: se prueba con Node</text>
  <g fill="#c9d1d9" font-size="12" font-family="monospace">
    <text x="416" y="146">requestJson</text>
    <text x="416" y="166">createLatest</text>
    <text x="416" y="186">reduce</text>
    <text x="416" y="206">statusText</text>
    <text x="416" y="226">cardHtml</text>
    <text x="416" y="246">validate</text>
    <text x="416" y="266">createCache</text>
  </g>

  <!-- server.js -->
  <rect x="630" y="70" width="150" height="220" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="705" y="98" text-anchor="middle" fill="#d29922" font-size="16" font-weight="bold" font-family="monospace">server.js</text>
  <text x="705" y="117" text-anchor="middle" fill="#8b949e" font-size="11">la API REST</text>
  <g fill="#c9d1d9" font-size="11" font-family="monospace">
    <text x="644" y="146">GET    /api/items</text>
    <text x="644" y="168">POST   /api/items</text>
    <text x="644" y="190">PUT    …/:id</text>
    <text x="644" y="212">DELETE …/:id</text>
  </g>
  <text x="705" y="246" text-anchor="middle" fill="#8b949e" font-size="11">vuelve a validar</text>
  <text x="705" y="262" text-anchor="middle" fill="#8b949e" font-size="11">con FIELDS</text>

  <!-- Flechas del camino -->
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="120" x2="178" y2="120"/>
    <line x1="178" y1="175" x2="142" y2="175"/>
    <line x1="360" y1="150" x2="398" y2="150"/>
    <line x1="398" y1="210" x2="362" y2="210"/>
    <line x1="590" y1="140" x2="628" y2="140"/>
    <line x1="628" y1="200" x2="592" y2="200"/>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <text x="160" y="112" fill="#F7DF1E">1</text>
    <text x="160" y="167" fill="#F7DF1E">5</text>
    <text x="380" y="142" fill="#F7DF1E">2</text>
    <text x="380" y="202" fill="#F7DF1E">4</text>
    <text x="609" y="132" fill="#F7DF1E">3</text>
    <text x="609" y="192" fill="#F7DF1E">3</text>
  </g>

  <!-- copia local -->
  <rect x="180" y="320" width="180" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="270" y="346" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold" font-family="monospace">localStorage</text>
  <text x="270" y="368" text-anchor="middle" fill="#8b949e" font-size="11">{ version, savedAt, data }</text>
  <line x1="270" y1="318" x2="270" y2="292" stroke="#8b949e" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="309" fill="#8b949e" font-size="10">createCache</text>

  <!-- data.js -->
  <rect x="400" y="320" width="380" height="70" rx="8" fill="#161b22" stroke="#F7DF1E"/>
  <text x="590" y="346" text-anchor="middle" fill="#F7DF1E" font-size="14" font-weight="bold" font-family="monospace">data.js: APP · FIELDS · SEED</text>
  <text x="590" y="368" text-anchor="middle" fill="#8b949e" font-size="11">lo usan main.js (formulario) y server.js (reglas y fichas)</text>

  <!-- Leyenda de pasos -->
  <text x="400" y="420" text-anchor="middle" fill="#8b949e" font-size="12">1 evento · 2 reduce(load) y requestJson · 3 petición y respuesta · 4 reduce(loaded o failed) · 5 render</text>
</svg>
