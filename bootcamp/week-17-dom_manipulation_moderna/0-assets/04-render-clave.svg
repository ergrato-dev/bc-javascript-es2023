<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Render por clave: reutilizar los nodos por id</text>

  <!-- Columnas -->
  <text x="130" y="72" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">Antes (en la página)</text>
  <text x="400" y="72" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">Datos nuevos</text>
  <text x="670" y="72" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">Después</text>

  <!-- Antes -->
  <rect x="40" y="90" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="130" y="115" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">id 1 · Arrecife</text>
  <rect x="40" y="140" width="180" height="40" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="130" y="165" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="13">id 2 · Océano</text>
  <rect x="40" y="190" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="130" y="215" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">id 3 · Río</text>

  <!-- Datos -->
  <rect x="310" y="90" width="180" height="40" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="400" y="115" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="13">{ id: 4, Manglar }</text>
  <rect x="310" y="140" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">{ id: 3, Río }</text>
  <rect x="310" y="190" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="400" y="215" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">{ id: 1, Arrecife }</text>

  <!-- Después -->
  <rect x="580" y="90" width="180" height="40" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="670" y="115" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="13">id 4 · creado</text>
  <rect x="580" y="140" width="180" height="40" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="670" y="165" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="13">id 3 · movido</text>
  <rect x="580" y="190" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="670" y="215" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">id 1 · sin tocar</text>

  <line x1="490" y1="110" x2="580" y2="110" stroke="#3fb950" stroke-width="2"/>
  <line x1="490" y1="160" x2="580" y2="160" stroke="#58a6ff" stroke-width="2"/>
  <line x1="490" y1="210" x2="580" y2="210" stroke="#30363d" stroke-width="2"/>

  <!-- Pasos -->
  <rect x="40" y="260" width="720" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="60" y="288" fill="#f85149" font-size="14">1. Quitar: el id 2 ya no está en los datos, su nodo sale con remove()</text>
  <text x="60" y="316" fill="#3fb950" font-size="14">2. Crear: el id 4 no tiene nodo en el Map, se crea con la plantilla</text>
  <text x="60" y="344" fill="#58a6ff" font-size="14">3. Mover solo lo que no está en su sitio: el Río pasa delante del Arrecife</text>
  <text x="60" y="368" fill="#8b949e" font-size="13">El nodo del Arrecife no se toca: conserva el foco y cualquier texto escrito.</text>
</svg>
