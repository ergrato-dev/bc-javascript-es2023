<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
  <rect width="800" height="420" fill="#0d1117"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Del formulario a un objeto con tipos</text>

  <!-- Formulario -->
  <rect x="16" y="64" width="232" height="250" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="132" y="90" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Formulario</text>
  <text x="30" y="120" fill="#c9d1d9" font-size="12">Nombre: «  Ana  »</text>
  <text x="30" y="146" fill="#c9d1d9" font-size="12">Entradas (number): «2»</text>
  <text x="30" y="172" fill="#c9d1d9" font-size="12">☐ Visita guiada (sin marcar)</text>
  <text x="30" y="198" fill="#c9d1d9" font-size="12">☑ Medusas  ☑ Tiburones</text>
  <text x="30" y="224" fill="#8b949e" font-size="12">Taquilla (disabled)</text>
  <text x="30" y="250" fill="#8b949e" font-size="12">Campo sin name</text>
  <text x="30" y="290" fill="#c9d1d9" font-size="12">[Reservar] name="action"</text>

  <line x1="252" y1="190" x2="290" y2="190" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="271" y="180" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">new</text>

  <!-- FormData -->
  <rect x="294" y="64" width="232" height="250" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="410" y="90" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">FormData: parejas de texto</text>
  <text x="308" y="120" fill="#c9d1d9" font-family="monospace" font-size="12">visitor  "  Ana  "</text>
  <text x="308" y="146" fill="#c9d1d9" font-family="monospace" font-size="12">tickets  "2"</text>
  <text x="308" y="172" fill="#f85149" font-size="12">guide: no está</text>
  <text x="308" y="198" fill="#c9d1d9" font-family="monospace" font-size="12">zones "Medusas"</text>
  <text x="308" y="216" fill="#c9d1d9" font-family="monospace" font-size="12">zones "Tiburones"</text>
  <text x="308" y="242" fill="#f85149" font-size="12">disabled y sin name: no están</text>
  <text x="308" y="268" fill="#8b949e" font-size="12">El botón, solo con</text>
  <text x="308" y="286" fill="#8b949e" font-family="monospace" font-size="11">new FormData(form, submitter)</text>

  <line x1="530" y1="190" x2="568" y2="190" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Objeto -->
  <rect x="572" y="64" width="212" height="250" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="678" y="90" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Objeto con tipos</text>
  <text x="586" y="120" fill="#c9d1d9" font-family="monospace" font-size="12">visitor: 'Ana'</text>
  <text x="586" y="146" fill="#c9d1d9" font-family="monospace" font-size="12">tickets: 2</text>
  <text x="586" y="172" fill="#c9d1d9" font-family="monospace" font-size="12">guide: false</text>
  <text x="586" y="198" fill="#c9d1d9" font-family="monospace" font-size="12">zones: ['Medusas',</text>
  <text x="586" y="216" fill="#c9d1d9" font-family="monospace" font-size="12">  'Tiburones']</text>

  <!-- Conversiones -->
  <rect x="16" y="334" width="768" height="70" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="30" y="358" fill="#d29922" font-size="13" font-weight="bold">Cada campo se convierte según lo que significa</text>
  <text x="30" y="384" fill="#c9d1d9" font-family="monospace" font-size="12">get().trim()  ·  '' ? null : Number()  ·  has()  ·  getAll()</text>
  <text x="560" y="384" fill="#8b949e" font-size="12">Number('') vale 0: vacío ≠ 0</text>
</svg>
