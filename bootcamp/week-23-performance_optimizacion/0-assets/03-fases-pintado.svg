<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
  <rect width="800" height="380" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Lo que hace el navegador en cada fotograma</text>

  <!-- Fases -->
  <rect x="40" y="62" width="160" height="56" rx="10" fill="#161b22" stroke="#F7DF1E" stroke-width="2"/>
  <text x="120" y="87" text-anchor="middle" fill="#F7DF1E" font-size="15" font-weight="bold">JavaScript</text>
  <text x="120" y="106" text-anchor="middle" fill="#c9d1d9" font-size="11">cambia el DOM y estilos</text>

  <line x1="200" y1="90" x2="232" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="230,84 240,90 230,96" fill="#8b949e"/>

  <rect x="240" y="62" width="160" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="320" y="87" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">Estilos</text>
  <text x="320" y="106" text-anchor="middle" fill="#8b949e" font-size="11">qué CSS aplica</text>

  <line x1="400" y1="90" x2="432" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="430,84 440,90 430,96" fill="#8b949e"/>

  <rect x="440" y="62" width="160" height="56" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="520" y="87" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">Diseño</text>
  <text x="520" y="106" text-anchor="middle" fill="#8b949e" font-size="11">tamaño y posición</text>

  <line x1="600" y1="90" x2="632" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="630,84 640,90 630,96" fill="#8b949e"/>

  <rect x="640" y="62" width="120" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="700" y="87" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">Pintado</text>
  <text x="700" y="106" text-anchor="middle" fill="#8b949e" font-size="11">los píxeles</text>

  <text x="400" y="146" text-anchor="middle" fill="#8b949e" font-size="12">Todo en menos de 16 ms para que la pantalla no vaya a saltos</text>

  <!-- Mal: por turnos -->
  <text x="40" y="190" fill="#f85149" font-size="14" font-weight="bold">Leer y escribir por turnos: el diseño se recalcula en cada vuelta</text>
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="40" y="204" width="64" height="30" rx="4" fill="#161b22" stroke="#F7DF1E"/>
    <text x="72" y="223" fill="#F7DF1E">escribe</text>
    <rect x="108" y="204" width="56" height="30" rx="4" fill="#161b22" stroke="#58a6ff"/>
    <text x="136" y="223" fill="#58a6ff">diseño</text>
    <rect x="168" y="204" width="50" height="30" rx="4" fill="#161b22" stroke="#F7DF1E"/>
    <text x="193" y="223" fill="#F7DF1E">lee</text>
    <rect x="222" y="204" width="64" height="30" rx="4" fill="#161b22" stroke="#F7DF1E"/>
    <text x="254" y="223" fill="#F7DF1E">escribe</text>
    <rect x="290" y="204" width="56" height="30" rx="4" fill="#161b22" stroke="#58a6ff"/>
    <text x="318" y="223" fill="#58a6ff">diseño</text>
    <rect x="350" y="204" width="50" height="30" rx="4" fill="#161b22" stroke="#F7DF1E"/>
    <text x="375" y="223" fill="#F7DF1E">lee</text>
    <rect x="404" y="204" width="64" height="30" rx="4" fill="#161b22" stroke="#F7DF1E"/>
    <text x="436" y="223" fill="#F7DF1E">escribe</text>
    <rect x="472" y="204" width="56" height="30" rx="4" fill="#161b22" stroke="#58a6ff"/>
    <text x="500" y="223" fill="#58a6ff">diseño</text>
    <rect x="532" y="204" width="50" height="30" rx="4" fill="#161b22" stroke="#F7DF1E"/>
    <text x="557" y="223" fill="#F7DF1E">lee</text>
    <text x="610" y="223" fill="#8b949e">…</text>
  </g>
  <text x="760" y="223" text-anchor="end" fill="#f85149" font-size="13" font-weight="bold">≈ 30 ms</text>

  <!-- Bien: por lotes -->
  <text x="40" y="282" fill="#3fb950" font-size="14" font-weight="bold">Primero todas las lecturas, después todas las escrituras</text>
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="40" y="296" width="150" height="30" rx="4" fill="#161b22" stroke="#F7DF1E"/>
    <text x="115" y="315" fill="#F7DF1E">lee, lee, lee…</text>
    <rect x="194" y="296" width="190" height="30" rx="4" fill="#161b22" stroke="#F7DF1E"/>
    <text x="289" y="315" fill="#F7DF1E">escribe, escribe, escribe…</text>
    <rect x="388" y="296" width="56" height="30" rx="4" fill="#161b22" stroke="#58a6ff"/>
    <text x="416" y="315" fill="#58a6ff">diseño</text>
  </g>
  <text x="760" y="315" text-anchor="end" fill="#3fb950" font-size="13" font-weight="bold">≈ 0,5 ms</text>

  <text x="400" y="362" text-anchor="middle" fill="#8b949e" font-size="11">Leer offsetWidth o getBoundingClientRect() después de un cambio obliga a calcular el diseño en ese momento</text>
</svg>
