<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
  <rect width="800" height="380" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Medir, cambiar y volver a medir</text>

  <!-- Ciclo -->
  <rect x="30" y="70" width="190" height="56" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="125" y="95" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">1. Medir</text>
  <text x="125" y="114" text-anchor="middle" fill="#c9d1d9" font-size="11">varias veces, la mediana</text>

  <line x1="125" y1="126" x2="125" y2="158" stroke="#8b949e" stroke-width="2"/>
  <polygon points="119,156 125,166 131,156" fill="#8b949e"/>

  <rect x="30" y="166" width="190" height="56" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="125" y="191" text-anchor="middle" fill="#d29922" font-size="15" font-weight="bold">2. Cambiar una cosa</text>
  <text x="125" y="210" text-anchor="middle" fill="#c9d1d9" font-size="11">la que más tarda</text>

  <line x1="125" y1="222" x2="125" y2="254" stroke="#8b949e" stroke-width="2"/>
  <polygon points="119,252 125,262 131,252" fill="#8b949e"/>

  <rect x="30" y="262" width="190" height="56" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="125" y="287" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="bold">3. Volver a medir</text>
  <text x="125" y="306" text-anchor="middle" fill="#c9d1d9" font-size="11">¿mejoró? si no, deshazlo</text>

  <path d="M 30 290 L 12 290 L 12 98 L 22 98" fill="none" stroke="#8b949e" stroke-width="2"/>
  <polygon points="20,92 30,98 20,104" fill="#8b949e"/>

  <!-- Línea de tiempo con mark y measure -->
  <text x="510" y="80" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">mark y measure</text>
  <line x1="270" y1="150" x2="770" y2="150" stroke="#30363d" stroke-width="2"/>
  <text x="770" y="170" text-anchor="end" fill="#8b949e" font-size="11">performance.now() →</text>

  <line x1="360" y1="105" x2="360" y2="150" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="360" cy="150" r="5" fill="#58a6ff"/>
  <text x="360" y="100" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="11">mark('ordenar:inicio')</text>

  <line x1="640" y1="105" x2="640" y2="150" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="640" cy="150" r="5" fill="#58a6ff"/>
  <text x="640" y="100" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="11">mark('ordenar:fin')</text>

  <rect x="360" y="180" width="280" height="26" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="198" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="11">measure('ordenar') · duration</text>

  <!-- Siete vueltas y la mediana -->
  <text x="510" y="246" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">7 vueltas del mismo código</text>
  <g fill="#161b22" stroke="#30363d" stroke-width="2">
    <rect x="290" y="270" width="44" height="60"/>
    <rect x="354" y="295" width="44" height="35"/>
    <rect x="418" y="300" width="44" height="30"/>
    <rect x="482" y="298" width="44" height="32"/>
    <rect x="610" y="292" width="44" height="38"/>
    <rect x="674" y="304" width="44" height="26"/>
  </g>
  <rect x="546" y="296" width="44" height="34" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <line x1="270" y1="330" x2="740" y2="330" stroke="#30363d" stroke-width="2"/>
  <text x="312" y="264" text-anchor="middle" fill="#f85149" font-size="11">1.ª: JIT</text>
  <text x="568" y="350" text-anchor="middle" fill="#3fb950" font-size="11">mediana</text>
  <text x="510" y="368" text-anchor="middle" fill="#8b949e" font-size="11">La primera vuelta suele ser la más lenta: la mediana no se deja llevar por ella</text>
</svg>
