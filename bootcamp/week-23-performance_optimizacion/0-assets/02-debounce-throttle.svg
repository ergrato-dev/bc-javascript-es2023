<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif">
  <rect width="800" height="360" fill="#0d1117"/>
  <text x="400" y="34" text-anchor="middle" fill="#F7DF1E" font-size="20" font-weight="bold">Una ráfaga de eventos: ¿cuándo se hace el trabajo?</text>

  <!-- Eje de tiempo: 0 ms en x=200, 100 ms = 100 px -->
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="200" y="330">0 ms</text>
    <text x="300" y="330">100</text>
    <text x="400" y="330">200</text>
    <text x="500" y="330">300</text>
    <text x="600" y="330">400</text>
    <text x="700" y="330">500</text>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="200" y1="70" x2="200" y2="312"/>
    <line x1="300" y1="70" x2="300" y2="312"/>
    <line x1="400" y1="70" x2="400" y2="312"/>
    <line x1="500" y1="70" x2="500" y2="312"/>
    <line x1="600" y1="70" x2="600" y2="312"/>
    <line x1="700" y1="70" x2="700" y2="312"/>
  </g>

  <!-- Fila 1: eventos -->
  <text x="30" y="100" fill="#c9d1d9" font-size="14" font-weight="bold">Eventos</text>
  <text x="30" y="118" fill="#8b949e" font-size="11">uno cada 40 ms</text>
  <line x1="190" y1="105" x2="760" y2="105" stroke="#30363d" stroke-width="2"/>
  <g fill="#58a6ff">
    <rect x="198" y="90" width="4" height="30"/>
    <rect x="248" y="90" width="4" height="30"/>
    <rect x="288" y="90" width="4" height="30"/>
    <rect x="328" y="90" width="4" height="30"/>
    <rect x="368" y="90" width="4" height="30"/>
    <rect x="408" y="90" width="4" height="30"/>
    <rect x="448" y="90" width="4" height="30"/>
    <rect x="488" y="90" width="4" height="30"/>
    <rect x="528" y="90" width="4" height="30"/>
    <rect x="568" y="90" width="4" height="30"/>
    <rect x="608" y="90" width="4" height="30"/>
    <rect x="648" y="90" width="4" height="30"/>
  </g>

  <!-- Fila 2: debounce -->
  <text x="30" y="180" fill="#3fb950" font-size="14" font-weight="bold">Debounce 100 ms</text>
  <text x="30" y="198" fill="#8b949e" font-size="11">cuando paran</text>
  <line x1="190" y1="185" x2="760" y2="185" stroke="#30363d" stroke-width="2"/>
  <rect x="650" y="178" width="100" height="14" rx="3" fill="#161b22" stroke="#3fb950" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="700" y="166" text-anchor="middle" fill="#8b949e" font-size="10">espera 100 ms</text>
  <circle cx="750" cy="185" r="9" fill="#3fb950"/>

  <!-- Fila 3: throttle -->
  <text x="30" y="260" fill="#d29922" font-size="14" font-weight="bold">Throttle 100 ms</text>
  <text x="30" y="278" fill="#8b949e" font-size="11">uno por ventana</text>
  <line x1="190" y1="265" x2="760" y2="265" stroke="#30363d" stroke-width="2"/>
  <g fill="none" stroke="#d29922" stroke-width="1" stroke-dasharray="4 3">
    <rect x="200" y="250" width="100" height="30" rx="3"/>
    <rect x="300" y="250" width="100" height="30" rx="3"/>
    <rect x="400" y="250" width="100" height="30" rx="3"/>
    <rect x="500" y="250" width="100" height="30" rx="3"/>
    <rect x="600" y="250" width="100" height="30" rx="3"/>
    <rect x="700" y="250" width="60" height="30" rx="3"/>
  </g>
  <g fill="#d29922">
    <circle cx="200" cy="265" r="9"/>
    <circle cx="300" cy="265" r="9"/>
    <circle cx="400" cy="265" r="9"/>
    <circle cx="500" cy="265" r="9"/>
    <circle cx="600" cy="265" r="9"/>
    <circle cx="700" cy="265" r="9"/>
  </g>
  <text x="700" y="300" text-anchor="middle" fill="#d29922" font-size="10">el último pendiente</text>

  <text x="400" y="352" text-anchor="middle" fill="#8b949e" font-size="11">12 eventos: el debounce trabaja 1 vez, al final; el throttle, 6 veces, la última con el último evento</text>
</svg>
